<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" role="img" aria-label="MissionBuilder guided workspace preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162744"/>
      <stop offset="1" stop-color="#0A1628"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#F5A623" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="600" fill="url(#bg)"/>
  <rect width="480" height="600" fill="url(#glow)"/>

  <!-- top bar -->
  <rect x="0" y="0" width="480" height="54" fill="#0A1628"/>
  <circle cx="34" cy="27" r="12" fill="none" stroke="#F5A623" stroke-width="2"/>
  <path d="M34 17 L38 27 L34 37 L30 27 Z" fill="#F5A623"/>
  <text x="56" y="33" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">MissionBuilder</text>
  <text x="424" y="32" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#F5A623" text-anchor="end">STEP 4 OF 7</text>

  <!-- step progress -->
  <g>
    <line x1="40" y1="86" x2="440" y2="86" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="86" x2="240" y2="86" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="86" r="7" fill="#F5A623"/>
    <circle cx="107" cy="86" r="7" fill="#F5A623"/>
    <circle cx="174" cy="86" r="7" fill="#F5A623"/>
    <circle cx="240" cy="86" r="9" fill="#F5A623" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="307" cy="86" r="7" fill="#1E3A5F"/>
    <circle cx="374" cy="86" r="7" fill="#1E3A5F"/>
    <circle cx="440" cy="86" r="7" fill="#1E3A5F"/>
  </g>

  <!-- prompt label -->
  <text x="40" y="132" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#F5A623">CRAFT YOUR MISSION</text>
  <text x="40" y="158" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">What will you commit to?</text>

  <!-- mission statement card -->
  <g>
    <rect x="40" y="182" width="400" height="212" rx="14" fill="#F4F7FB"/>
    <rect x="64" y="206" width="150" height="12" rx="6" fill="#0A1628"/>
    <rect x="64" y="234" width="352" height="9" rx="4.5" fill="#94A3B8"/>
    <rect x="64" y="254" width="330" height="9" rx="4.5" fill="#94A3B8"/>
    <rect x="64" y="274" width="348" height="9" rx="4.5" fill="#94A3B8"/>
    <rect x="64" y="294" width="220" height="9" rx="4.5" fill="#94A3B8"/>
    <rect x="64" y="322" width="96" height="26" rx="13" fill="#FDEBCB"/>
    <text x="112" y="339" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#C97D0E" text-anchor="middle">FOR WHOM</text>
    <rect x="170" y="322" width="110" height="26" rx="13" fill="#FDEBCB"/>
    <text x="225" y="339" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#C97D0E" text-anchor="middle">ACTION VERBS</text>
    <rect x="290" y="322" width="100" height="26" rx="13" fill="#FDEBCB"/>
    <text x="340" y="339" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#C97D0E" text-anchor="middle">DONE WELL</text>
    <rect x="64" y="364" width="180" height="9" rx="4.5" fill="#CBD5E1"/>
  </g>

  <!-- next button -->
  <rect x="40" y="422" width="152" height="44" rx="22" fill="#F5A623"/>
  <text x="108" y="449" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#0A1628" text-anchor="middle">Next step →</text>

  <!-- compass footer motif -->
  <g opacity="0.55">
    <circle cx="240" cy="540" r="34" fill="none" stroke="#1E3A5F" stroke-width="2"/>
    <circle cx="240" cy="540" r="24" fill="none" stroke="#1E3A5F" stroke-width="1"/>
    <path d="M240 514 L248 540 L240 566 L232 540 Z" fill="#F5A623"/>
    <text x="240" y="509" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle">N</text>
  </g>
  <text x="240" y="592" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#94A3B8" text-anchor="middle">KNOW YOUR TRUE NORTH</text>
</svg>
